<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daybook – typed task tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <h1>Daybook</h1>
    <p class="sub">Every task is type-checked before it reaches the screen.</p>

    <div class="addrow">
      <input id="title" placeholder="What needs doing?" autocomplete="off" />
      <button id="add">Add task</button>
    </div>

    <div id="chips" class="chips"></div>
    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden>Nothing here yet. Add a task above.</p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
